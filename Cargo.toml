[package]
name = "plimb-studio"
version = "0.1.0"
edition = "2021"
description = "Plimb Studio : l'IA locale avec les modèles Plimb"
license = "MIT"
repository = "https://github.com/Plimb-ai/plimb-app"
build = "build.rs"
default-run = "plimb-studio"

[lib]
name = "plimb_studio"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "plimb-studio"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2"] }
candle-core = "0.11"
candle-nn = "0.11"
ureq = "3"
fancy-regex = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rand = "0.9"
anyhow = "1"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software"] }
rfd = "0.18"
self-replace = "1"
dirs = "7"
open = "5"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Optimise les dépendances même en debug : l'inférence est sinon inutilisable.
[profile.dev.package."*"]
opt-level = 3

# ---------------------------------------------------------------- Android (cargo-apk)
[package.metadata.android]
package = "ai.plimb.studio"
apk_name = "plimb-studio"
build_targets = ["aarch64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Plimb Studio"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density"
launch_mode = "singleTop"
orientation = "unspecified"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
